name: Build Moonlight Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project from ZIP
        run: |
          unzip -q -o Moonlight_Demo_Wallet.zip -d extracted
          test -f extracted/Moonlight_Client_Project/settings.gradle
          ls -la extracted/Moonlight_Client_Project

      - name: Build debug APK
        run: gradle -p extracted/Moonlight_Client_Project assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Launcher-APK
          path: extracted/Moonlight_Client_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
